name: PR Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CICD: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test --configuration Release --no-build --no-restore \
            --logger "trx;LogFileName=results.trx" \
            --logger "console;verbosity=normal" || TEST_EXIT=$?
          if [ -f results.trx ]; then
            echo "## Failed Tests" >> $GITHUB_STEP_SUMMARY
            grep -E '<UnitTestResult|<Message|<StackTrace' results.trx \
              | grep -A2 'outcome="Failed"' >> $GITHUB_STEP_SUMMARY || true
          fi
          exit ${TEST_EXIT:-0}
